# Integração e entrega contínuas: em todo push e pull request roda os testes do backend e a checagem de
# tipos do frontend; num push na main, se tudo passar, atualiza a VM de produção via SSH.
#
# O deploy só roda depois de configurado no repositório (ver DEPLOY.md, "Deploy automático"):
#   Variables: DEPLOY_ENABLED=true
#   Secrets:   VM_HOST (IP da VM), VM_USER (ubuntu), VM_SSH_KEY (chave privada SSH)
name: CI e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test

  frontend:
    name: Checagem de tipos do frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  deploy:
    name: Deploy na VM
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar o SIGREST na VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_vm
          chmod 600 ~/.ssh/id_vm
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_vm "$VM_USER@$VM_HOST" 'cd ~/SigRest && bash deploy/deploy.sh'
