# =====================================================
# Perfil de producao (SPRING_PROFILES_ACTIVE=prod, ver docker-compose.prod.yml).
# Sobrescreve so o que muda em relacao ao application.properties.
# =====================================================

# SQL no log so atrapalha em producao (e enche o disco da VM).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# A API fica atras do Caddy: respeita os cabecalhos X-Forwarded-* (https, dominio e o prefixo /api).
server.forward-headers-strategy=framework
