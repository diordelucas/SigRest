# Ambiente de desenvolvimento com recarga automática: o código é montado dentro dos containers, então
# nenhuma imagem é reconstruída a cada alteração.
#   - Frontend: o servidor do React recarrega a página sozinho ao salvar (1-3 s).
#   - Backend: recompila e reinicia a API ao salvar (ver backend/dev-run.sh).
#   - Banco: o mesmo do docker-compose.yml, com os mesmos dados.
#
# Uso (na raiz do projeto):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up db backend frontend
# ou simplesmente ./dev.ps1 (Windows) / ./dev.sh (Linux/macOS).

services:
  backend:
    image: maven:3.9.6-eclipse-temurin-17
    build: !reset null
    working_dir: /app
    command: ["sh", "dev-run.sh"]
    volumes:
      - ./backend:/app
      - maven_repo:/root/.m2         # dependências baixadas uma vez só
      - backend_target:/app/target   # classes compiladas fora do bind mount do Windows, que é lento
    environment:
      - SPRING_DEVTOOLS_RESTART_TRIGGERFILE=.reloadtrigger
      - SPRING_DEVTOOLS_LIVERELOAD_ENABLED=false

  frontend:
    image: node:18-alpine
    build: !reset null
    working_dir: /app
    command: ["sh", "dev-start.sh"]
    ports: !override
      - "${FRONTEND_PORT:-3000}:3000"   # servidor de desenvolvimento do React (no modo normal é o nginx, na 80)
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:${BACKEND_PORT:-8080}
      # Bind mount do Windows não propaga eventos de arquivo: o webpack precisa verificar por polling.
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=0

volumes:
  maven_repo:
  backend_target:
  frontend_node_modules:
