# Produção (VM da Oracle Cloud). Só o Caddy fica exposto na internet (portas 80/443, HTTPS automático):
#   https://SEU_DOMINIO/       -> frontend (build do React servido pelo nginx)
#   https://SEU_DOMINIO/api/*  -> backend (Spring Boot), no mesmo domínio: sem CORS
# O banco não publica porta nenhuma: só o backend o enxerga, pela rede interna do Docker.
#
# Configuração em .env.prod (criado pelo deploy/setup-vm.sh, ver DEPLOY.md). Para subir/atualizar:
#   bash deploy/deploy.sh

# Nome próprio: o docker-compose.yml local usa "sigrest" (nome da pasta) e os dois não podem se misturar.
name: sigrest-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod   # ativa application-prod.properties e o ProductionSecurityValidator
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      APP_CORS_ALLOWED_ORIGINS: https://${SITE_DOMAIN}
      REPORT_COMPANY_NAME: ${REPORT_COMPANY_NAME:-SIGREST Gestão}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados HTTPS (Let's Encrypt)
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
