# Serve o build do React (frontend/Dockerfile).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Rotas do React Router (/dashboard, /reports...): o que não for arquivo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos do build têm hash no nome: podem ficar em cache no navegador por muito tempo.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Estes precisam ser revalidados sempre, senão uma versão nova do sistema não chega ao navegador.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
    }
}
